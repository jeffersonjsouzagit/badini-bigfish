version: '3.8'

services:
  # ============================================
  # POSTGRESQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: badini-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: badini
      POSTGRES_PASSWORD: ${DB_PASSWORD:-badini_secret_2024}
      POSTGRES_DB: badini_bigfish
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badini"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # BACKEND API
  # ============================================
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: badini-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://badini:${DB_PASSWORD:-badini_secret_2024}@postgres:5432/badini_bigfish
      JWT_SECRET: ${JWT_SECRET:-seu_jwt_secret_super_seguro_aqui}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-seu_jwt_refresh_secret_aqui}
      FRONTEND_URL: ${FRONTEND_URL:-https://badinibigfish.com.br}
      ADMIN_URL: ${ADMIN_URL:-https://badinibigfish.com.br}
      PAYMENT_API_URL: ${PAYMENT_API_URL}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
    ports:
      - "3001:3001"
    volumes:
      - ./client:/app/client:ro
      - ./admin:/app/admin:ro

  # ============================================
  # NGINX (REVERSE PROXY)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: badini-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client:/var/www/client:ro
      - ./admin:/var/www/admin:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_data:/var/cache/nginx

volumes:
  postgres_data:
  nginx_data:
